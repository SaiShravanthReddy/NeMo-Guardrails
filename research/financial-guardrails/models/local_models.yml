selection_notes:
  - Both models run locally and require no paid API.
  - DeBERTa is the smaller specialized injection detector and can run on CPU.
  - Qwen3Guard covers English, Chinese, and broad safety categories but is generative and slower.
  - RAM values are conservative planning estimates, not measurements from this repository.
  - Model thresholds and labels must be calibrated on development data before benchmark claims.
